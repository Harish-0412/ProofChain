[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FacultyFlow"
version = "0.1.0"
description = "Local-first FacultyFlow MCP server for academic work planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "mcp >= 1.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
